name: Build Thine APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer==1.5.0 cython==0.29.36
          echo "cython==0.29.36" > /tmp/constraints.txt
      - name: Build APK
        env:
          PIP_CONSTRAINT: /tmp/constraints.txt
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Thine-APK
          path: bin/*.apk
        uses: actions/upload-artifact@v4
        with:
          name: Thine-APK
          path: bin/*.apk
